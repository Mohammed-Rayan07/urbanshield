server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;          # Server-Sent Events must stream
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
